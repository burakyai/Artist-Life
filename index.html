<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Artist Life — Müzisyen Hayat Simülasyonu</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Artist Life">
<meta name="theme-color" content="#120e1a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e1a;--panel:#1b1626;--panel2:#251e33;--line:#342a45;--ink:#f3eefb;--muted:#a69cba;--acc:#ff5fa2;--acc2:#a378ff;--acc3:#5b8cff;--tint:#231736;--tint2:#3a1d52;--tint3:#5a1d44;--deep:#150f1f;--gold:#ffc24b;--good:#6fd39a;--bad:#ff7d73;
 --display:"Bebas Neue",Impact,sans-serif;--body:"Barlow",system-ui,-apple-system,sans-serif;--cond:"Barlow Condensed","Barlow",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.42}
input{font:inherit}
#game{display:none;height:100%;max-width:520px;margin:0 auto;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,var(--tint) 0%,var(--bg) 60%)}
#game.on{display:flex}
.top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--tint),var(--bg))}
.av{border-radius:50%;background:radial-gradient(circle at 50% 30%,#3a2d52,#1a1426 72%);border:2px solid var(--acc2);overflow:hidden;flex:none;display:grid;place-items:center}
.av svg{width:100%;height:100%;display:block}
#hav{width:60px;height:60px;border-image:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 33%,transparent),0 0 18px color-mix(in srgb,var(--acc2) 27%,transparent)}
.who{flex:1;min-width:0}
.who h1{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:.04em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{font-family:var(--cond);font-size:15px;color:var(--muted);margin-top:3px}
.who p b{color:var(--acc);font-weight:600}
.cash{text-align:right}
.cash small{display:block;font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.1em}
.cash strong{font-family:var(--cond);font-size:21px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.cash strong.neg{color:var(--bad)}
#log{flex:1;overflow-y:auto;padding:6px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.yr{padding:10px 0;border-bottom:1px dashed var(--line)}
.yr h3{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.yr h3:before{content:"♪ ";color:var(--acc2)}
.yr p{font-size:15.5px;line-height:1.45;margin:3px 0}
.yr p.good{color:var(--good)}.yr p.bad{color:var(--bad)}.yr p.gold{color:var(--gold);font-weight:600}.yr p.dim{color:var(--muted)}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.st label{display:flex;justify-content:space-between;font-family:var(--cond);font-size:13px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.st label b{color:var(--ink)}
.bar{height:7px;border-radius:4px;background:var(--deep);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.chips{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--cond);font-size:13.5px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--cond);font-size:13px;letter-spacing:.05em;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .age{margin-top:-30px}
.nav .age span.c{width:76px;height:76px;border-radius:50%;background:conic-gradient(from 200deg,var(--acc),var(--acc2),var(--acc3),var(--acc));display:grid;place-items:center;box-shadow:0 6px 24px color-mix(in srgb,var(--acc) 33%,transparent);border:3px solid var(--panel)}
.nav .age span.c em{font-style:normal;font-family:var(--display);font-size:17px;color:#fff;line-height:.9;text-align:center;letter-spacing:.04em}
.nav .age span.c small{display:block;font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.12em}
.nav .age:active span.c{transform:scale(.95)}
#bdg i{position:absolute;top:0;right:calc(50% - 22px);background:var(--acc);color:#fff;font-style:normal;font-size:11px;border-radius:9px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:20}
.ov.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{flex:1;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.05em}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:20px;line-height:1}
.sh-b{overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{font-family:var(--cond);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:16px 0 8px}
.sec:first-child{margin-top:2px}
.note{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:8px}
.gold{color:var(--gold)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.row:not(:disabled):active{background:var(--tint2)}
.row .ic{width:40px;height:40px;border-radius:11px;background:var(--deep);display:grid;place-items:center;font-size:20px;flex:none}
.row .ic .rk{font-family:var(--display);font-size:22px;color:var(--acc)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px}
.row .tx b small{color:var(--muted);font-weight:500;font-size:13px}
.row .tx span{display:block;font-size:13px;color:var(--muted);margin-top:1px;line-height:1.35}
.row .rt{font-family:var(--cond);font-size:14px;font-weight:600;color:var(--gold);text-align:right;white-space:nowrap}
.tbar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,var(--tint2),var(--tint3));margin-bottom:4px;font-family:var(--cond);font-size:15px;color:var(--muted)}
.tbar b{color:#fff;font-size:17px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.ch b{font-size:17px}
.pill{font-family:var(--cond);font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--tint2);color:var(--acc2);white-space:nowrap}
.pill.gold{background:#3d3015;color:var(--gold);font-size:15px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0 8px}
.kv div{background:var(--deep);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted);font-family:var(--cond);letter-spacing:.04em}
.kv div b{display:block;color:var(--ink);font-size:16px;font-family:var(--body);letter-spacing:0;margin-top:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{padding:9px 12px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px}
.mini.sec{background:var(--panel);border:1px solid var(--line);color:var(--muted);margin:0;font-family:var(--body);letter-spacing:0;text-transform:none}
.mini.red{background:#3b1d22;color:var(--bad)}
.mini.inl{margin:-4px 0 10px auto;display:block;font-size:12.5px;padding:6px 10px}
.hero2{border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--tint2),var(--tint3));margin-bottom:4px}
.hero2 small{font-family:var(--cond);letter-spacing:.1em;text-transform:uppercase;color:#e9d9ff;font-size:12.5px}
.hero2 .big{font-family:var(--display);font-size:46px;letter-spacing:.02em;line-height:1;margin:4px 0}
.hero2 span{font-size:13px;color:#e4d6f5}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plat{border-radius:14px;padding:11px;color:#fff}
.plat b{font-size:14px}
.plat .pv{font-family:var(--display);font-size:28px;letter-spacing:.02em;margin:3px 0 1px}
.plat span{display:block;font-size:11.5px;opacity:.9}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:6px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border:0;color:var(--good);padding-top:8px}
.neg{color:var(--bad)}
.leg{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{width:100%;display:block}
.city{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.wprev{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 10px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-family:var(--cond);font-size:15px;color:var(--muted)}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);text-align:center}
.it.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.it .av{width:74px;height:74px;border-width:1px}
.it b{font-size:13.5px;font-weight:600;line-height:1.15}
.it span{font-size:12px;color:var(--gold);font-family:var(--cond)}
/* oluşturma */
#create{display:none;height:100%;overflow-y:auto;background:radial-gradient(120% 50% at 50% 0%,var(--tint),var(--bg) 65%)}
#create.on{display:block}
.cwrap{max-width:520px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 30px;text-align:center}
.logo{font-family:var(--display);font-weight:400;font-size:48px;letter-spacing:.08em;line-height:1}
.logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-family:var(--cond);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-size:13px;margin:4px 0 14px}
.av.hero{width:180px;height:180px;margin:0 auto 14px;border-width:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 20%,transparent),0 0 40px color-mix(in srgb,var(--acc2) 33%,transparent)}
.names{display:flex;gap:8px;margin-bottom:6px}
.names input{flex:1;min-width:0;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:17px}
.dice{width:52px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px}
.start{margin-top:16px;width:100%;padding:16px;border-radius:14px;font-family:var(--display);font-size:26px;letter-spacing:.08em;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 27%,transparent)}
/* olay */
.mod{position:fixed;inset:0;background:#000b;display:none;z-index:40;align-items:center;justify-content:center;padding:20px}
.mod.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90%;overflow:auto}
.box h2{font-family:var(--display);font-weight:400;font-size:32px;letter-spacing:.04em;margin-bottom:6px}
.box p{line-height:1.5;color:#e2dbee;margin-bottom:14px}
.eh{font-family:var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-size:13px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;margin-bottom:8px;font-size:16px}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.dead{text-align:center}.dead .av.big{width:120px;height:120px;margin:0 auto 10px;filter:grayscale(.7)}
.dead .kv{text-align:left}
.row.sel{border-color:var(--acc);background:var(--tint2)}
.row .ic .cvi,.cvi{display:block;width:40px;height:40px;border-radius:8px;overflow:hidden}.cvi svg{width:100%;height:100%;display:block}
.songhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.cov{width:132px;height:132px;flex:none;border-radius:10px;overflow:hidden;box-shadow:0 8px 22px #0008}.cov svg{width:100%;height:100%;display:block}
.shx{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.pill.sm{font-size:12px}.pill.hot{background:#4a1d1d;color:#ffb199}
.lab{display:block;font-family:var(--cond);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 5px}
.inp{width:100%;padding:12px;border-radius:12px;background:var(--deep);border:1px solid var(--line);color:var(--ink);font-size:17px}
.dice2{margin-top:6px;display:inline-block}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
.tab.sm{font-size:13.5px;padding:6px 11px}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.swc{width:34px;height:34px;border-radius:9px;border:2px solid transparent}.swc.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.tbl tr.th td{font-family:var(--cond);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl td+td{text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin:8px 0 2px}
.rk2{font-family:var(--cond);font-size:11.5px;color:var(--gold)}
.btn:disabled{opacity:.45}
.cert{display:inline-block;font-family:var(--cond);font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--cc);color:var(--cc);background:#0006;vertical-align:middle}.cert.sm{font-size:11px;padding:0 6px}
.cov{width:160px!important}
.cvi{width:50px!important}.row .ic:has(.cvi){width:52px;background:none}.cvi.sm{width:34px!important;height:28px!important}
.tk{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:8px 0 3px}.tk b{color:var(--ink)}
.ngr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.ngr>div:first-child{flex:1}.ngr b{display:block;font-size:15px}.ngr span{font-size:12.5px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}.stp button{min-width:34px;height:34px;border-radius:9px;background:var(--deep);border:1px solid var(--line);font-weight:700;padding:0 8px;font-size:14px}.stp em{font-style:normal;font-weight:700;min-width:64px;text-align:center;font-family:var(--cond);font-size:16px}
.pat{font-family:var(--cond);color:var(--gold);letter-spacing:.06em}
.msg{padding:10px 12px;border-radius:12px;background:var(--tint2);margin:4px 0 10px;font-size:14.5px;line-height:1.4}
.btn.star{background:linear-gradient(135deg,#ffc24b,#ff7a3d);color:#2a1500}
.plat{text-align:left;width:100%;display:block}.plat .go{margin-top:4px;font-weight:700;opacity:1}
.plathead{border-radius:16px;padding:14px;color:#fff;margin-bottom:6px}.plathead b{font-size:20px;display:block}.plathead>span{font-size:13px;opacity:.9}.plathead .kv div{background:#0005;color:#fff}
.chart20 .cr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}.chart20 .cr.me{background:linear-gradient(90deg,var(--tint2),var(--tint3));border-radius:10px;cursor:pointer}
.chart20 em{font-style:normal;font-family:var(--display);font-size:22px;width:26px;text-align:center;color:var(--acc)}.chart20 .cr>div{flex:1;min-width:0}.chart20 b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart20 span{font-size:12.5px;color:var(--muted)}.chart20 i{font-style:normal;font-family:var(--cond);font-size:14px}.chart20 small{width:36px;text-align:right;font-family:var(--cond);font-size:12px;color:var(--muted)}
.up{color:#6fd39a}.dn{color:#ff7d73}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#3d8bff;color:#fff;font-size:10px;vertical-align:middle}
.stk .srow{display:flex;align-items:center;gap:12px}.spark{width:120px;height:36px}.stk .srow b{display:block;font-size:17px}.stk .srow span{font-size:12px;color:var(--muted)}.stk small{color:var(--muted);font-weight:500}
.gear{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#0006;font-size:15px;flex:none}
.av.sa{width:44px;height:44px;border-width:1px}.row .ic:has(.sa){width:46px;background:none}
.grid.g2{grid-template-columns:repeat(4,1fr)}.gic{font-size:26px}
body.big{font-size:18px}body.big .yr p{font-size:17.5px}body.big .row .tx b{font-size:17.5px}body.big .row .tx span{font-size:14.5px}
.inp.amt{margin:6px 0 8px;font-variant-numeric:tabular-nums}.stp .inp.amt{margin:0;padding:8px;font-size:15px;min-width:0}
#title{display:none;height:100%;overflow-y:auto;background:radial-gradient(120% 50% at 50% 0%,var(--tint),var(--bg) 65%)}#title.on{display:block}
.appic{width:120px;height:120px;border-radius:26px;display:block;margin:4px auto 18px;box-shadow:0 10px 30px #0009}
.slot{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-bottom:10px}
.slot.empty{border-style:dashed}.slot .sbody{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding-right:30px}
.sic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--deep);color:var(--acc);flex:none}
.av.sav{width:56px;height:56px;border-width:1.5px}.slot.dead .av.sav{filter:grayscale(.8)}
.stx{flex:1;min-width:0}.stx b{display:block;font-size:17px}.stx span{display:block;font-size:13px;color:var(--muted);margin-top:1px}.stx em{color:var(--bad);font-style:normal}

function trRank(w){if(w<220000)return null;return clamp(Math.round(50-(Math.log10(w)-Math.log10(220000))/(Math.log10(4500000)-Math.log10(220000))*49),1,50)}
function glRank(w){if(w<9e6)return null;return clamp(Math.round(50-(Math.log10(w)-Math.log10(9e6))/(Math.log10(8e7)-Math.log10(9e6))*49),1,50)}

function showEvent(){const q=S.evq[0];if(!q)return;const e=EVENTS.find(x=>x.id===q.id);
 $('mod').innerHTML=`<div class="box"><div class="eh">Yaş ${S.age}</div><h2>${e.title}</h2><p>${esc(e.text(q.p))}</p>${S.star&&EVSTAR[e.id]?`<button class="btn star" onclick="pickEv('star')">⭐ ${EVSTAR[e.id][0]}</button>`:''}${e.ch.map((c,i)=>`<button class="btn ${i?'sec':''}" onclick="pickEv(${i})">${c.t}</button>`).join('')}</div>`;$('mod').classList.add('on')}
function pickEv(i){const q=S.evq.shift(),e=EVENTS.find(x=>x.id===q.id);$('mod').classList.remove('on');if(i==='star')EVSTAR[e.id][1](q.p);else e.ch[i].fn(q.p);S.fol=Math.round(S.fol);calcFame();save();render();if(S.evq.length)setTimeout(showEvent,150)}
function showDeath(){const best=[...S.songs].sort((a,b)=>b.total-a.total)[0];
 $('mod').innerHTML=`<div class="box dead"><div class="av big">${AV(S.look,S.age)}</div><h2>${esc(S.first)} ${esc(S.last)}</h2><p class="eh">${S.age} yaşında hayata veda etti</p>
 <div class="kv"><div>Unvan<b>${title()}</b></div><div>Takipçi<b>${num(S.fol)}</b></div><div>Toplam dinlenme<b>${num(S.tot.streams)}</b></div><div>Servet<b>${fmtS(S.money)}</b></div><div>En büyük hit<b>${best?esc(best.t):'—'}</b></div><div>Ödüller<b>${S.awards.length}</b></div><div>En iyi TR sırası<b>${S.best.tr?'#'+S.best.tr:'—'}</b></div><div>Albümler<b>${S.albums.length}</b></div></div>
 <button class="btn" onclick="restart()">Yeni hayat</button></div>`;$('mod').classList.add('on')}

function extInit(){const d={q:0,qt:0,pend:{spo:0,tube:0,fizzy:0,pear:0},bank:0,loan:0,port:{},mkt:null,friends:[],star:false,smw:{ig:.55,tt:.4,yt:.25,x:.15},smc:{},places:{},watches:[],hup:{},chart:null,advYr:-1};
 Object.keys(d).forEach(k=>{if(S[k]===undefined)S[k]=d[k]});
 if(!S.mkt){S.mkt={};STOCKS.forEach(x=>{const p=R(12,180);S.mkt[x.id]={p,h:[p]}})}
 S.songs.forEach(s=>{if(s.cert==null)s.cert=-1});
 if(S.contract&&S.contract.reqS==null){const c=S.contract;c.reqS=c.req||4;c.reqC=0;c.clips=0;c.recoup=true}
 if(S.partner&&!S.partner.trait){S.partner.trait=pick(Object.keys(TRAITS));S.partner.type=pick(Object.keys(FTYPES))}}
const fol=(k)=>Math.round(S.fol*(S.smw[k]||.2));
function addF(n,k){S.fol+=n;if(k)S.smw[k]=Math.min(1.2,(S.smw[k]||.2)+.01);calcFame()}

/* ---------- Sosyal medya ---------- */
ACT.soc=(k,a)=>{S.smc[k]=S.smc[k]||0;if(S.smc[k]>=4){toast('Bu yıl bu hesapta yeterince paylaştın.');return}S.smc[k]++;const st=stil(),F=S.fol;let g=0;
 const last=released().sort((x,y)=>y.ra-x.ra||y.id-x.id)[0];
 if(a==='post'){g=30+F*RF(.002,.006)*(1+st/40);log(`Instagram'a yeni kombinini paylaştın. +${num(g)} takipçi`)}
 if(a==='story'){g=20+F*RF(.0015,.004);add('happy',1);log(`Stüdyodan kulis hikayesi paylaştın. +${num(g)} takipçi`)}
 if(a==='live'){g=15+F*RF(.0015,.0035);add('happy',4);log(`Instagram'da canlı yayın açtın, hayranlarla sohbet ettin. +${num(g)} takipçi`,'good')}
 if(a==='trend'){g=25+F*RF(.002,.005);if(last){last.pot*=1.2;S.tiktok=1}log(`TikTok'ta trend videosu çektin${last?` ("${last.t}" ile)`:''}. +${num(g)} takipçi`)}
 if(a==='dans'){if(ch(S.star?1:.15)){g=F*RF(.05,.1)+500;if(last)last.pot*=2;log(`Dans challenge'ın patladı! Herkes "${last?last.t:'senin şarkın'}" ile video çekiyor. +${num(g)} takipçi`,'gold')}else{g=10+F*.002;log('Dans challenge pek tutmadı.','dim')}}
 if(a==='vlog'){g=20+F*RF(.0015,.0045);log(`TubeX kanalına vlog yükledin. +${num(g)} abone`)}
 if(a==='kamera'){g=20+F*RF(.0015,.004);const c=released().find(x=>x.clip);if(c)c.pot*=1.1;log(`Klip kamera arkası videosu yayınladın. +${num(g)} abone`)}
 if(a==='tweet'){const r=Math.random();if(S.star||r<.5){g=F*RF(.005,.012);log(`Tweet'in gündem oldu. +${num(g)} takipçi`,'good')}else if(r<.75){g=-F*.01;add('happy',-8);log('Tweet\'in polemik yarattı, linç yedin.','bad')}else{g=5;log('Tweet\'in pek ilgi görmedi.','dim')}}
 if(a==='soru'){g=10+F*RF(.001,.0025);add('happy',2);log(`Hayranlarının sorularını cevapladın. +${num(g)} takipçi`)}
 addF(Math.round(g),k);sheet('kariyer')};

/* ---------- Arkadaşlar ---------- */
ACT.meet=id=>{const pl=PLACES.find(x=>x.id===id);if(S.places[id]===S.qt){toast('Bu yıl burayı zaten ziyaret ettin.');return}if(S.age<pl.min||S.fame<pl.fame)return;S.places[id]=S.qt;
 if(id==='kulup'){add('happy',4);add('health',-2)}
 if(!ch(S.star?1:.7+S.fame/300)){log(`${pl.n}nde kimseyle yakınlaşamadın.`,'dim');sheet('hayat');return}
 if(S.friends.length>=16){toast('Arkadaş listen dolu.');return}
 const type=pick(pl.types),g=ch(.5)?'e':'k';let name,fame=0,genre=null;
 if(type==='sanatci'){const free=ARTISTS2.filter(n=>!S.friends.some(f=>f.name===n));name=pick(free.length?free:ARTISTS2);fame=clamp(R(15,95)+(id==='odul'?15:0));genre=pick(Object.keys(GENRES))}else name=pick(g==='k'?NM_K:NM_E)+' '+pick(SURN);
 const f={id:S.nid++,name,g,type,trait:pick(Object.keys(TRAITS)),yak:R(35,60),fame,genre,done:0,fav:-1};S.friends.push(f);
 log(`${pl.n}nde ${FTYPES[type].n.toLowerCase()} ${name} ile tanıştın${type==='sanatci'?` (${GENRES[genre].n}, şöhret ${fame})`:''}.`,'good');sheet('hayat')};
ACT.fTime=id=>{const f=S.friends.find(x=>x.id===id);if(f.done){toast('Bu yıl zaten vakit geçirdiniz.');return}f.done=1;f.yak=clamp(f.yak+R(7,14));add('happy',2);if(f.trait==='partici'){add('happy',2);add('health',-2)}log(`${f.name} ile ${f.trait==='partici'?'sabaha kadar eğlendin':'güzel vakit geçirdin'}.`,'good');sheet('hayat')};
const FAVS={sanatci:'Düet teklif et',produktor:'Beat iste',soz:'Şarkı sözü iste',yonetmen:'Klibini çeksin',dj:'Setinde şarkını çalsın',model:'Klibinde oynasın',isinsani:'Borsa tüyosu iste',sporcu:'Birlikte antrenman',normal:'Dertleş'};
ACT.fFav=id=>{const f=S.friends.find(x=>x.id===id);if(f.fav===S.qt){toast('Bu yıl zaten bir iyilik istedin.');return}if(f.yak<50&&!S.star){toast('Yakınlığınız en az %50 olmalı.');return}f.fav=S.qt;
 const tal=f.trait==='yetenekli'?1.4:1;
 switch(f.type){
  case 'sanatci':if(ch(S.star?1:.4+f.yak/200-(f.fame-S.fame)/200)){S.feat=f.name;S.featBoost=1+f.fame/90;log(`${f.name} düet teklifini kabul etti! Sıradaki şarkın feat. ${f.name}.`,'gold')}else{f.yak=clamp(f.yak-5);log(`${f.name} "Şu an albüm sürecindeyim" dedi.`,'dim')}break;
  case 'produktor':S.prodB=Math.round(8*tal);log(`${f.name} sana bir beat hazırladı. Sıradaki kaydın kalitesi +${S.prodB}.`,'good');break;
  case 'soz':S.lyB=Math.round(7*tal);log(`${f.name} sana söz yazdı. Sıradaki şarkın kalitesi +${S.lyB}.`,'good');break;
  case 'yonetmen':S.dirFree=1;log(`${f.name} bir sonraki klibini ücretsiz çekecek.`,'good');break;
  case 'dj':{const s=released().sort((a,b)=>b.ra-a.ra)[0];if(s){s.pot*=1.3;log(`${f.name} setlerinde "${s.t}" çalmaya başladı.`,'good')}else log(`${f.name}: "Önce bir şarkı çıkar, çalarım."`,'dim');break}
  case 'model':S.modelB=1;addF(Math.round(S.fol*.02+100),'ig');log(`${f.name} bir sonraki klibinde oynayacak. Ortak fotoğrafınız çok beğenildi.`,'good');break;
  case 'isinsani':{const best=[...STOCKS].sort(()=>Math.random()-.5)[0];S.tip=best.id;log(`${f.name} fısıldadı: "Bu yıl ${best.n} (${best.id}) uçacak."`,'gold');break}
  case 'sporcu':add('health',R(6,12));log(`${f.name} ile antrenman yaptın.`,'good');break;
  default:add('happy',R(5,10));log(`${f.name} ile dertleştin, içini döktün.`,'good')}
 if(f.trait==='baglantili'&&!S.contract&&S.genre&&ch(.6)){genLabel(true);log(`${f.name} seni bir plak şirketinin yöneticisiyle tanıştırdı. Teklif geldi!`,'gold')}
 sheet('hayat')};
ACT.fLove=id=>{const f=S.friends.find(x=>x.id===id);if(S.partner){toast('Zaten bir ilişkin var.');return}if(ch(S.star?1:f.yak/130)){S.partner={id:f.id,name:f.name,age:S.age+R(-3,3),yak:f.yak,st:'sevgili',g:f.g,type:f.type,trait:f.trait};S.friends=S.friends.filter(x=>x.id!==id);add('happy',8);log(`${f.name} ile sevgili oldunuz!${f.type==='sanatci'?' Magazin manşetleri sizi konuşuyor.':''}`,'gold');if(f.type==='sanatci')addF(Math.round(S.fol*.04),'ig')}else{f.yak=clamp(f.yak-12);log(`${f.name} "Seni sadece arkadaş olarak görüyorum" dedi.`,'bad')}SUB=null;sheet('hayat')};
ACT.fEnd=id=>{const f=S.friends.find(x=>x.id===id);S.friends=S.friends.filter(x=>x.id!==id);log(`${f.name} ile arkadaşlığını bitirdin.`,'dim');SUB=null;sheet('hayat')};
ACT.trait=(who,id,t)=>{if(!S.star)return;const p=who==='p'?S.partner:S.friends.find(x=>x.id===id);p.trait=t;sheet('hayat')};

/* ---------- Banka & borsa ---------- */
function loanLimit(){return Math.round(Math.max(200000,S.fame*S.fame*12000+S.bank*.5))}
ACT.dep=x=>{x=x==='all'?Math.max(0,S.money):x;if(x<=0||S.money<x){toast('Kasanda yeterli nakit yok.');return}S.money-=x;S.bank+=x;sheet('hayat')};
ACT.wd=x=>{x=x==='all'?S.bank:Math.min(x,S.bank);if(x<=0)return;S.bank-=x;S.money+=x;sheet('hayat')};
ACT.loanT=x=>{if(S.loan+x>loanLimit()){toast('Kredi limitin: '+fmtS(loanLimit()));return}S.loan+=x;S.money+=x;log(`Bankadan ${fmtS(x)} kredi çektin.`,'dim');sheet('hayat')};
ACT.loanP=x=>{x=x==='all'?S.loan:Math.min(x,S.loan);if(S.money<x){toast('Kasanda yeterli nakit yok.');return}S.money-=x;S.loan-=x;if(!S.loan)log('Kredi borcunu kapattın.','good');sheet('hayat')};
const portVal=()=>Object.entries(S.port).reduce((a,[k,v])=>a+v.q*S.mkt[k].p,0);
ACT.buy=(id,x)=>{x=x==='all'?S.money:x;if(x<=0||S.money<x){toast('Kasanda yeterli nakit yok.');return}const p=S.mkt[id].p;S.money-=x;const h=S.port[id]=S.port[id]||{q:0,c:0};h.q+=x/p;h.c+=x;sheet('hayat')};
ACT.sell=(id,f)=>{const h=S.port[id];if(!h)return;const q=h.q*f,v=q*S.mkt[id].p;S.money+=v;h.c*=1-f;h.q-=q;if(h.q<1e-6)delete S.port[id];sheet('hayat')};
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function marketYear(){STOCKS.forEach(x=>{const m=S.mkt[x.id];let r=x.mu+x.sg*gauss()-x.sg*x.sg/2;if(x.id==='SHNE'||x.id==='ATLS')r+=(S.fame-50)/1000;if(S.tip===x.id)r=Math.max(r,.25+Math.random()*.3);m.p=Math.max(.5,m.p*Math.exp(r));m.h.push(m.p);if(m.h.length>16)m.h.shift()});S.tip=null;
 if(S.bank>0){const i=S.bank*.15;S.bank+=i;if(i>1000)log(`Banka hesabına ${fmtS(i)} faiz işledi.`,'dim')}
 if(S.loan>0){const i=S.loan*.42;S.loan+=i;log(`Kredi faizi: ${fmtS(i)} (borç ${fmtS(S.loan)})`,'bad')}}
function spark(h,c){const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;return `<svg viewBox="0 0 100 30" class="spark"><polyline points="${h.map((v,i)=>`${(i/(Math.max(1,h.length-1))*100).toFixed(1)},${(28-(v-mn)/r*26).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="1.8"/></svg>`}

/* ---------- Alışveriş & ev ---------- */
ACT.watch=id=>{const w=WATCHES.find(x=>x.id===id);if(S.watches.includes(id))return;if(S.age<16){toast('Biraz büyü.');return}if(!pay(w.p))return;S.watches.push(id);log(`${w.n} aldın! (${fmtS(w.p)})`,'good');sheet('hayat')};
ACT.hfeat=(hid,fid)=>{const f=HFEAT.find(x=>x.id===fid);S.hup[hid]=S.hup[hid]||[];if(S.hup[hid].includes(fid))return;if(!pay(f.p))return;S.hup[hid].push(fid);const h=HOUSES.find(x=>x.id===hid);log(`${h.n} evine ${f.n.toLowerCase()} yaptırdın.`,'good');sheet('hayat')};
const hasF=fid=>Object.entries(S.hup||{}).some(([h,a])=>S.houses.includes(h)&&a.includes(fid));

/* ---------- Plak şirketi pazarlığı ---------- */
function genLabel(force){const f=S.fame,mt=Math.min(5,1+Math.floor(Math.max(0,f-15)/14));const L=pick(LABELS.filter(l=>l.t<=mt)),yrs=R(2,4);
 const b={adv:Math.round(L.t*L.t*1.2e6*(1+f/20)*RF(.7,1.3)/1e4)*1e4,roy:Math.round(clamp(RF(16,30)-L.t*1.5+f/12,12,45)),yrs,reqS:yrs*2+R(0,2),reqC:Math.max(0,yrs-1+R(-1,1)),rec:true,is360:ch(.4)};
 S.offers.push({id:S.nid++,k:'label',n:L.n,t:L.t,b,ask:{...b},pat:3,flex:.1+f/350+(S.manager?.08:0)+RF(0,.08),ok:false,msg:''})}
function negScore(o){const a=o.ask,b=o.b;return .4*a.adv/b.adv+.4*a.roy/b.roy+.08*b.reqS/Math.max(1,a.reqS)+.05*(b.reqC+1)/(a.reqC+1)+.07*b.yrs/a.yrs+(a.rec?0:.3)+(b.is360&&!a.is360?.12:0)-(!b.is360&&a.is360?.1:0)}
const LIM={adv:[0,1e12],roy:[5,70],yrs:[1,6],reqS:[1,30],reqC:[0,10]};
ACT.negSet=(id,k,d)=>{const o=S.offers.find(x=>x.id===id),a=o.ask;if(k==='rec'||k==='is360')a[k]=!a[k];else if(k==='adv')a.adv=Math.max(0,Math.round((a.adv+d*o.b.adv*.1)/1e4)*1e4);else a[k]=clamp(a[k]+d,LIM[k][0],LIM[k][1]);o.ok=false;o.msg='';drawSheet()};
ACT.negSend=id=>{const o=S.offers.find(x=>x.id===id),sc=negScore(o),mx=1+o.flex+(S.star?.8:0);
 if(sc<=mx){o.ok=true;o.msg=`✅ ${o.n}: "Bu şartlar bize uyar. İmzalayalım."`}
 else{o.pat--;if(o.pat<=0){S.offers=S.offers.filter(x=>x.id!==id);log(`${o.n} pazarlıktan çekildi. "Başka sanatçılarla devam edeceğiz."`,'bad');SUB={t:'offers',title:'Teklifler'};sheet('kariyer');return}
  if(sc<=mx+.3){const a=o.ask,b=o.b;a.adv=Math.round((a.adv+b.adv)/2/1e4)*1e4;a.roy=Math.round((a.roy+b.roy)/2);a.reqS=Math.ceil((a.reqS+b.reqS)/2);a.reqC=Math.ceil((a.reqC+b.reqC)/2);a.yrs=Math.round((a.yrs+b.yrs)/2);if(!a.rec&&ch(.6))a.rec=true;if(b.is360&&!a.is360&&ch(.5))a.is360=true;o.ok=negScore(o)<=mx;o.msg=`🔁 ${o.n} karşı teklif verdi. Şartlar güncellendi.`}
  else o.msg=`❌ ${o.n}: "Bu şartlar bizim için çok ağır." (sabır ${o.pat}/3)`}
 drawSheet()};

/* ============ Hayat (sekmeli), sevgili, ayarlar ============ */
function shHayat(){const T=SUB&&SUB.t;if(T==='friend')return shFriend(SUB.id);if(T==='places')return shPlaces();if(T==='bank')return shBank();if(T==='borsa')return shBorsa();if(T==='shop')return shShop();if(T==='hfeat')return shHouse(SUB.id);if(T==='self')return shSelf();
 if(T==='p')return shFam(SUB.id);if(T==='partner')return shPartner();
 const tab=S.htab||'iliski';let h=`<div class="tabs">${[['iliski','İlişkiler'],['varlik','Varlıklar'],['finans','Finans'],['aktivite','Aktiviteler']].map(([k,n])=>`<button class="tab ${tab===k?'on':''}" onclick="S.htab='${k}';drawSheet()">${n}</button>`).join('')}</div>`+`<div class="tbar"><span>Bu 3 ayda kalan hakkın</span><b>${S.months} / ${HAK}</b></div>`;
 if(tab==='iliski'){
  if(S.age>=16){h+=sec('Aşk');h+=S.partner?row(`sheet('hayat',{t:'partner',title:'İlişki'})`,'❤️',esc(S.partner.name),`${S.partner.st==='eş'?'Eşin':'Sevgilin'} · ${FTYPES[S.partner.type||'normal'].n} · ${TRAITS[S.partner.trait||'sadik'].n} · Yakınlık %${S.partner.yak}`,'›'):row('ACT.date()','💘','Aşk ara','Şöhret ve stil şansını artırır','1 hak')}
  h+=sec(`Arkadaşlar (${S.friends.length})`)+row("sheet('hayat',{t:'places',title:'Tanışma yerleri'})",'📍','Yeni insanlarla tanış','Gece kulübü, stüdyo, kulis, dizi seti, maç locası…','›');
  if(!S.friends.length)h+=note('Henüz arkadaşın yok. Tanışma yerlerine giderek meslek ve tip sahibi arkadaşlar edinebilirsin.');
  S.friends.forEach(f=>h+=row(`sheet('hayat',{t:'friend',id:${f.id},title:'Arkadaş'})`,FTYPES[f.type].ic,esc(f.name),`Meslek: ${FTYPES[f.type].n} · Tip: ${TRAITS[f.trait].n} · Yakınlık %${f.yak}`,'›'));
  h+=sec('Ailen');S.fam.forEach(p=>h+=row(`sheet('hayat',{t:'p',id:${p.id},title:'Ailen'})`,p.alive?(p.id===1?'👩':'👨'):'🕊',esc(p.name),`${p.rel} · ${p.age} yaş${p.alive?' · Yakınlık %'+p.yak:' · Vefat etti'}`,'›'));
  if(S.kids.length){h+=sec('Çocukların');S.kids.forEach(k=>h+=row(`sheet('hayat',{t:'p',id:${k.id},title:'Çocuğun'})`,k.age<3?'👶':k.g==='k'?'👧':'👦',esc(k.name),`${k.rel} · ${k.age} yaş · Yakınlık %${k.yak}`,'›'))}}
 if(tab==='varlik'){const cur=S.house?HOUSES.find(x=>x.id===S.house):null;h+=sec('Ev')+note(cur?`Şu an ${cur.loc}'deki ${cur.n.toLowerCase()}nde yaşıyorsun.`:'Ailenle birlikte yaşıyorsun.');
  HOUSES.forEach(x=>{const own=S.houses.includes(x.id),c=S.house===x.id;h+=row(own&&!c&&!x.second?`ACT.house('${x.id}')`:own?'':`ACT.house('${x.id}')`,x.ic,x.n+(c?' · evin':own&&x.second?' · senin':''),`${x.loc} · ${x.rent?'Kira '+fmtS(x.rent)+'/yıl':fmtS(x.p)+' · aidat '+fmtS(x.up)+'/yıl'} · mutluluk +${x.hap}`,own?(c||x.second?'':'Taşın'):(x.rent?'Kirala':'Satın al'))+(own&&!x.rent?`<button class="mini inl" onclick="sheet('hayat',{t:'hfeat',id:'${x.id}',title:'Evi düzenle'})">🛠 Düzenle · ${(S.hup[x.id]||[]).length}/${HFEAT.length}</button>`:'')+(own?`<button class="mini red inl" onclick="ACT.sellHouse('${x.id}')">${x.rent?'Evden çık':'Sat · '+fmtS(x.p*.9)}</button>`:'')});
  h+=sec('Alışveriş')+row("sheet('hayat',{t:'shop',tab:'araba',title:'Galeri'})",'🏎','Araba galerisi',`${CARS.length} model · ${S.cars.length} araban var`,'›')+row("sheet('hayat',{t:'shop',tab:'saat',title:'Saatçi'})",'⌚','Saat butiği','Rolex, Audemars Piguet, Patek Philippe, Richard Mille…','›')}
 if(tab==='finans')h+=sec('Finans')+row("sheet('hayat',{t:'bank',title:'Banka'})",'🏦','Banka hesabı',`Mevduat ${fmtS(S.bank)}${S.loan?' · kredi borcu '+fmtS(S.loan):''}`,'›')+row("sheet('hayat',{t:'borsa',title:'Borsa'})",'📈','Borsa',`Portföy ${fmtS(portVal())}`,'›')+row("sheet('panel')",'💰','Platform hesapların',`Çekilmeyi bekleyen telif ${fmtS(pendT())}`,'›');
 if(tab==='aktivite')h+=sec('Aktiviteler')+row('ACT.gym()','🏋','Spor salonu','Sağlık ↑','1 hak')+row('ACT.doctor()','🩺','Doktora git','Sağlık ↑↑',(S.age<18?'Ücretsiz':'₺15 B')+' · 1 hak')+row('ACT.vac()','🏖','Tatile çık','Mutluluk ↑↑',fmtS(60000*(1+S.fame/20))+' · 1 hak')+row('ACT.party()','🍸','Gece hayatı','Mutluluk ↑ · sağlık ↓','1 hak');
 return h}
function shFam(id){const p=S.fam.find(x=>x.id===id)||S.kids.find(x=>x.id===id);let h=`<div class="card"><div class="ch"><b>${esc(p.name)}</b><span class="pill">${p.rel}</span></div>${note(`${p.age} yaş${p.job?' · '+p.job:''} · Yakınlık %${p.yak}`)}</div>`;
 if(p.alive===false)return h+note('Huzur içinde yatsın.');
 h+=row(`ACT.famTime(${p.id})`,'☕','Vakit geçir','Yakınlık ↑ · mutluluk ↑',p.done?'Yapıldı':'1 hak',!!p.done);
 if(p.job)h+=row(`ACT.famMoney(${p.id})`,'💸','Para iste','Yakınlığınıza bağlı',p.asked?'Bu yıl istendi':'1 hak',!!p.asked);
 if(S.age>=18)h+=row(`ACT.famGift(${p.id})`,'🎁','Hediye al','Servetinin %1\'i',fmtS(Math.max(2000,S.money*.01)));return h}

 h+=sec('Birlikte')+row("ACT.pDo('date')",'🍷','Gezmeye çık','Yemek, sinema, konser…',fmtS(8000*(1+S.fame/25))+' · 1 hak')+row("ACT.pDo('night')",'🌙','Romantik gece','Yakınlık ↑↑ · bebek haberi gelebilir','1 hak')+row("ACT.pDo('trip')",'✈️','Birlikte tatile git','Yakınlık ↑↑↑ · mutluluk ↑↑',fmtS(120000*(1+S.fame/20))+' · 2 hak')+row("ACT.pDo('talk')",'💬','Dertleş','Yakınlık ↑','1 hak');
 h+=sec('Hediye al')+`<div class="grid g2">${GIFTS.map((g,i)=>`<button class="it" onclick="ACT.pGift(${i})"><span class="gic">${g[0]}</span><b>${g[1]}</b><span>${fmtS(g[2])}</span></button>`).join('')}</div>`;
 h+=sec('Para ver')+amtIn('pm_a','Vereceğin tutar (₺)')+`<button class="btn" onclick="ACT.pMoney(amtV('pm_a'))">💸 Para ver</button>`+(p.cash?note(`Bugüne kadar ${fmtS(p.cash)} verdin.`):'');
 h+=sec('Gelecek');if(p.st==='sevgili')h+=row('ACT.propose()','💍','Evlenme teklif et','Yüzük ve düğün masrafı',fmtS(Math.max(150000,S.money*.02)));
 h+=row('ACT.baby()','👶','Çocuk sahibi olmak için uğraş','Şansa bağlı','1 hak')+row('ACT.breakup()','💔',p.st==='eş'?'Boşan':'Ayrıl',p.st==='eş'?'Servetinin %30\'u gider':'','');
 return h+traitPick('p',0,p.trait)}

function lab(){return S.lab}

function randLook(g){const L={skin:R(0,4),hair:pick((g==='k'?HAIR_K:HAIR_E).map(x=>x[0])),hairColor:pick(['siyah','kahve','kumral','sari','kizil','siyah','platin','pembe']),beard:g==='e'?pick(['yok','kirli','kisasakal','keci','yok','tam']):'yok',outfit:pick(['tisort','baski','hoodie','deri','gomlek','kolej','hawaii','kadife','pullu',g==='k'?'elbise':'esofman']),oc:{},acc:[],g};
 const ac=[pick(['zincir','kuba','kat','iced','tag','choker','inci',null]),pick(['gozluk','vizor','yuvarlak','kalin',null,null]),pick(['cap','bere','bucket',null,null,null]),pick(['kupe','halka',null])].filter(Boolean);L.acc=ac;const o=OCOLM[L.outfit];if(o)L.oc[L.outfit]=pick(o)[1];return L}
function newCand(){const g=ch(.6)?'e':'k',ar=hasLF('ar');const f=pick(g==='k'?AFIRST_K:AFIRST_E);const name=(g==='e'&&ch(.4)?pick(ASTAGE):'')+f+(ch(.5)?' '+pick(SURN):'');
 const tal=clamp(R(20,80)+(ar?R(5,18):0)),fol=Math.round(Math.pow(10,RF(2.7,5.4))*(ar?1.4:1));return {id:S.nid++,name:name.trim(),g,look:randLook(g),genre:pick(Object.keys(GENRES)),tal,fol,type:pick(Object.keys(ATYPES)),happy:R(60,85),demos:[],con:null,tot:0,earn:0}}
const aFame=a=>clamp((Math.log10(Math.max(1,a.fol))-2.3)*19.5);
function askBase(a){return {adv:Math.round((a.fol*4+a.tal*25000+150000)/1e4)*1e4,roy:Math.round(clamp(18+aFame(a)/3+(a.type==='diva'?6:0),15,60)),yrs:3,reqS:6,rec:true}}

ACT.labFound=()=>{if(S.lab)return;if(S.fame<35&&!S.star){toast('Şirket kurmak için şöhretin en az 35 olmalı.');return}const cost=25000000;if(!pay(cost))return;
 S.lab={n:(S.last+' Records'),cash:20000000,bld:'ofis',feats:[],arts:[],cand:[],songs:[],tot:{gross:0,net:0},hist:[],found:S.age};log(`Kendi plak şirketini kurdun: ${S.lab.n}! Kuruluş ve sermaye ${fmtS(cost)}. Şirket kasasında ${fmtS(20e6)} var.`,'gold');sheet('kariyer',{t:'lab',title:'Şirketim'})};
ACT.labName=v=>{S.lab.n=v.slice(0,28);save()};
ACT.labMove=(dir,x)=>{const L=S.lab;if(dir==='in'){if(!pay(x))return;L.cash+=x}else{x=x==='all'?L.cash:x;if(L.cash<x){toast('Şirket kasasında yeterli para yok.');return}L.cash-=x;S.money+=x;log(`${L.n} kasasından ${fmtS(x)} temettü çektin.`,'dim')}drawSheet();render()};
ACT.labBld=id=>{const L=S.lab,b=BLDS.find(x=>x.id===id);if(L.bld===id)return;if(L.cash<b.p){toast('Şirket kasası yetmiyor: '+fmtS(b.p));return}L.cash-=b.p;L.bld=id;log(`${L.n} yeni binasına taşındı: ${b.n} (${b.loc}).`,'gold');drawSheet()};
ACT.labFeat=id=>{const L=S.lab,f=BFEAT.find(x=>x.id===id);if(L.feats.includes(id))return;if(L.cash<f.p){toast('Şirket kasası yetmiyor: '+fmtS(f.p));return}L.cash-=f.p;L.feats.push(id);log(`${L.n} binasına ${f.n.toLowerCase()} kuruldu.`,'good');drawSheet()};
ACT.scout=()=>{const L=S.lab;if(L.cash<100000){toast('Yetenek avı ₺100 B');return}if(!useM(1))return;L.cash-=100000;L.cand=[newCand(),newCand(),newCand()];log('A&R ekibin yeni yetenekler buldu.','dim');sheet('kariyer',{t:'lab',title:'Şirketim'})};
ACT.offerSet=(id,k,d)=>{const a=S.lab.cand.find(x=>x.id===id);a.ask=a.ask||askBase(a);const o=a.ask,b=askBase(a);if(k==='rec')o.rec=!o.rec;else if(k==='adv')o.adv=Math.max(0,Math.round((o.adv+d*b.adv*.1)/1e4)*1e4);else o[k]=clamp(o[k]+d,k==='roy'?5:1,k==='roy'?80:k==='yrs'?6:30);drawSheet()};
function acceptP(a){const o=a.ask||askBase(a),b=askBase(a);const sc=.45*o.adv/Math.max(1,b.adv)+.45*o.roy/b.roy+.05*b.reqS/o.reqS+.05*b.yrs/o.yrs+(o.rec?0:.15);const fx=(a.type==='diva'?-.1:0)+(S.fame/400)+(hasLF('lounge')?.05:0);return clamp((sc-.78+fx)/.35,0,1)}
ACT.signArt=id=>{const L=S.lab,a=L.cand.find(x=>x.id===id),o=a.ask||askBase(a);if(L.arts.length>=labBld().cap){toast(`Binanda en fazla ${labBld().cap} sanatçı olabilir. Daha büyük binaya geç.`);return}if(L.cash<o.adv){toast('Şirket kasası avansa yetmiyor.');return}
 if(!useM(1))return;if(S.star||ch(acceptP(a))){L.cash-=o.adv;a.con={...o,left:o.yrs,del:0,unrec:o.rec?o.adv:0};L.arts.push(a);L.cand=L.cand.filter(x=>x.id!==id);log(`${a.name} ${L.n} ile ${o.yrs} yıllık sözleşme imzaladı! Avans ${fmtS(o.adv)}${o.rec?' (telifinden mahsup edilecek)':''}, telif payı %${o.roy}, ${o.reqS} şarkı taahhüdü.`,'gold')}
 else{a.tries=(a.tries||0)+1;log(`${a.name} teklifini reddetti.${a.tries>=2?' Başka bir şirketle anlaştı.':''}`,'bad');if(a.tries>=2)L.cand=L.cand.filter(x=>x.id!==id)}SUB={t:'lab',title:'Şirketim'};drawSheet()};
function artDemo(a){const q=Math.round(clamp(a.tal*.6+R(0,35)+(hasLF('studyo')?10:0),5,98));const d={id:S.nid++,t:genTitle(a.genre),q};a.demos.push(d);return d}
ACT.askSong=id=>{const a=S.lab.arts.find(x=>x.id===id);if(!useM(1))return;if(a.type==='tembel'&&ch(.45)&&!S.star){a.happy=clamp(a.happy-3);log(`${a.name} şarkıyı yetiştiremedi, "Gelecek ay kesin" dedi.`,'dim')}else{const d=artDemo(a);log(`${a.name} sana "${d.t}" demosunu teslim etti (kalite ${d.q}).`,'good')}drawSheet()};
ACT.relArt=(aid,did,pi)=>{const L=S.lab,a=L.arts.find(x=>x.id===aid),d=a.demos.find(x=>x.id===did),pb=[0,500000,5000000][pi];if(L.cash<pb){toast('Şirket kasası yetmiyor.');return}L.cash-=pb;
 const pot=(8000+120*Math.pow(a.fol,.8))*Math.pow(d.q/60,2.2)*S.trends[a.genre]*(hasLF('pr')?1.3:1)*(1+.8*pb/(pb+30000+a.fol*3))*(a.type==='yildiz'?1.3:1)*RF(.7,1.3);
 L.songs.push({id:S.nid++,t:d.t,aid,g:a.genre,q:d.q,pot,rq:S.qt,lq:0,total:0,gross:0,clip:1,viral:false});a.demos=a.demos.filter(x=>x.id!==did);a.con.del++;log(`${L.n}: ${a.name} — "${d.t}" yayında!`,'good');drawSheet()};
ACT.clipArt=sid=>{const L=S.lab,s=L.songs.find(x=>x.id===sid),c=Math.round(1500000*(hasLF('klip')?.5:1));if(s.clip>1)return;if(L.cash<c){toast('Şirket kasası yetmiyor: '+fmtS(c));return}L.cash-=c;s.clip=2;s.pot*=1.3;log(`"${s.t}" için klip çekildi (${fmtS(c)}).`,'good');drawSheet()};
ACT.gigArt=id=>{const L=S.lab,a=L.arts.find(x=>x.id===id);if(a.gq===S.qt){toast('Bu 3 ayda zaten konser verdi.');return}if(!useM(1))return;a.gq=S.qt;const g=Math.round(a.fol*RF(.8,2)*(a.type==='diva'?1.2:1)*(hasLF('sahne')?1.3:1)+R(20000,80000));const ls=Math.round(g*.3);L.cash+=ls;a.earn+=g-ls;a.fol+=Math.round(a.fol*.02+50);a.happy=clamp(a.happy+3);log(`${a.name} konser verdi: hasılat ${fmtS(g)}, şirket payı (%30) ${fmtS(ls)}.`,'good');drawSheet()};
ACT.bonusArt=id=>{const L=S.lab,a=L.arts.find(x=>x.id===id),x=Math.max(100000,Math.round(a.fol*.5));if(L.cash<x){toast('Şirket kasası yetmiyor.');return}L.cash-=x;a.happy=clamp(a.happy+15);log(`${a.name}'e ${fmtS(x)} prim verdin. Çok mutlu.`,'good');drawSheet()};
ACT.dropArt=id=>{const L=S.lab,a=L.arts.find(x=>x.id===id);L.arts=L.arts.filter(x=>x.id!==id);log(`${a.name} ile sözleşmeni feshettin.`,'dim');SUB={t:'lab',title:'Şirketim'};drawSheet()};
ACT.renewArt=id=>{const L=S.lab,a=L.arts.find(x=>x.id===id),x=Math.round(askBase(a).adv*.8);if(L.cash<x){toast('Yenileme avansı: '+fmtS(x));return}if(!S.star&&!ch(a.type==='sadik'?.95:a.happy/100)){log(`${a.name} sözleşmeyi uzatmak istemedi.`,'bad');drawSheet();return}L.cash-=x;a.con.left+=2;a.con.reqS+=4;if(a.con.rec)a.con.unrec+=x;log(`${a.name} sözleşmesini 2 yıl uzattı. Ek avans ${fmtS(x)}.`,'good');drawSheet()};

function labTick(){const L=S.lab;if(!L)return;let gT=0,netL=0,merch=0;
 L.songs.forEach(s=>{const k=S.qt-s.rq,a=L.arts.find(x=>x.id===s.aid)||{type:'',fol:1000};let v=s.pot*Math.max(.38*Math.pow(.72,k),.0125)+a.fol*.002;if(k<=6&&ch((.03+(a.type==='hitmaker'?.06:0)+Math.max(0,s.q-60)/500)/3)){v*=RF(2.5,5);s.pot*=1.6;s.viral=true;log(`${L.n}: "${s.t}" (${a.name||'eski sanatçın'}) viral oldu!`,'gold')}
  v=Math.round(v*(s.clip>1?1.1:1));s.lq=v;s.total+=v;const g=v*.135;s.gross+=g;gT+=g;
  if(a.con){const dist=hasLF('dagitim')?0:g*.15,base=g-dist,art=base*a.con.roy/100;let lbl=base-art;const rc=a.con.rec?Math.min(art,a.con.unrec):0;a.con.unrec-=rc;lbl+=rc;a.earn+=art-rc;netL+=lbl}else netL+=g*.5;
  if(a.fol!=null&&a.con)a.fol+=Math.round(v*.003)});
 L.arts.forEach(a=>{if(hasLF('merch'))merch+=a.fol*.4;if(hasLF('prova'))a.tal=clamp(a.tal+RF(.5,1.5));if(a.type==='yildiz')a.tal=clamp(a.tal+.5);a.happy=clamp(a.happy+(hasLF('lounge')?2:0)-(a.type==='diva'?R(2,5):R(0,2)));
  {const n=a.type==='caliskan'?2:a.type==='tembel'?(ch(.5)?1:0):R(1,2);for(let k=0;k<n&&a.demos.length<8;k++)artDemo(a)}if(a.type==='sorunlu'&&ch(.12)){a.fol=Math.round(a.fol*.9);a.happy=clamp(a.happy-5);log(`${L.n}: ${a.name} gece kulübünde kavgaya karıştı, magazin manşetlerinde.`,'bad')}
  if(a.happy<20&&ch(.3)){log(`${a.name} mutsuz: "Bana yeterince ilgi göstermiyorsunuz!"`,'bad')}});
 const exp=labBld().up/4+L.arts.length*150000;L.cash+=netL+merch-exp;L.tot.gross+=gT;L.tot.net+=netL+merch-exp;L.lastQ={gross:gT,net:netL,merch,exp};
 if(gT>0||merch>0)log(`${L.n} 3 aylık rapor: brüt ${fmtS(gT)}, şirkete kalan ${fmtS(netL+merch)}, gider ${fmtS(exp)}. Kasa: ${fmtS(L.cash)}`,'dim');
 if(L.cash<0){log(`${L.n} kasası ekside! (${fmtS(L.cash)}) Para aktarman gerekiyor.`,'bad')}}
function labYear(){const L=S.lab;if(!L)return;if(hasLF('cati'))add('happy',3);
 L.arts.forEach(a=>{a.con.left--;if(a.con.left<=0){const miss=Math.max(0,a.con.reqS-a.con.del);if(a.type==='sadik'||a.happy>65||S.star){a.con.left=2;a.con.reqS+=4;log(`${a.name} sözleşmesini 2 yıl daha uzattı.`,'good')}else{log(`${a.name}'in sözleşmesi bitti ve şirketten ayrıldı.${miss?` (${miss} şarkı borcu kaldı)`:''}`,'bad');a.gone=1}}});
 L.arts=L.arts.filter(a=>!a.gone);L.hist.push({age:S.age,net:L.tot.net});if(L.hist.length>40)L.hist.shift()}

/* ============ Süperstar: toplu ve otomatik görüşme ============ */
function bulkMeet(auto){const L=[];let n=0;
 S.fam.forEach(p=>{if(p.alive!==false){p.yak=clamp(p.yak+R(4,9));p.done=1;n++}});
 S.kids.forEach(k=>{k.yak=clamp(k.yak+R(4,9));k.done=1;n++});
 S.friends.forEach(f=>{f.yak=clamp(f.yak+R(4,9));f.done=1;n++});
 if(S.partner){S.partner.yak=clamp(S.partner.yak+R(5,10));S.partner.done=1;n++}
 if(!n)return 0;add('happy',auto?3:5);log(`${auto?'Otomatik görüşme':'Toplu görüşme'}: ailen, ${S.partner?'sevgilin, ':''}${S.kids.length?'çocukların, ':''}${S.friends.length} arkadaşınla vakit geçirdin. Herkesle yakınlığın arttı.`,auto?'dim':'good');return n}
ACT.bulk=()=>{if(!S.star){toast('Toplu görüşme Süperstar modunda kullanılabilir.');return}if(!bulkMeet(false)){toast('Görüşecek kimse yok.');return}save();render();drawSheet()};

const lcash=c=>{const L=S.lab;if(S.star)return true;if(L.cash<c){toast('Şirket kasası yetmiyor: '+fmtS(c));return false}L.cash-=c;return true};
const fullCap=()=>{if(S.lab.arts.length>=labCap()){toast('Şirketin dolu. Daha büyük bina al ya da alt marka kur.');return true}return false};

/* 1. Transfer piyasası */
function trMarket(){const X=l2();rivInit();X.tr=S.rivals.filter(r=>!r.signed).slice().sort((a,b)=>b.fame-a.fame).slice(0,8).map(r=>({rid:r.id,fee:Math.round((r.fame*r.fame*25000+5e6)*RF(.9,1.2)/1e5)*1e5}))}

 if(!S.star&&!ch(clamp(.35+(labPop()-r.fame)/150+.2,.1,.85))){log(`${r.name} transfer teklifini reddetti: "Şu anki şirketimde mutluyum."`,'dim');drawSheet();return}if(!lcash(o.fee))return;
 const a=mkArt({name:r.name,g:r.g,look:r.look,genre:r.genre,tal:clamp(55+r.fame*.4),fol:Math.round(Math.pow(10,4+r.fame/100*3)),type:'yildiz',happy:85,con:{adv:o.fee,roy:35,yrs:4,reqS:8,rec:false,left:4,del:0,unrec:0}});
 S.lab.arts.push(a);r.signed=1;S.rivals=S.rivals.filter(x=>x!==r);X.tr=X.tr.filter(x=>x!==o);log(`🔁 Yılın transferi: ${r.name} ${fmtS(o.fee)} bonservisle ${S.lab.n}'a geçti!`,'gold');sJingle&&sJingle();drawSheet()};
function trOffer(){const X=l2(),L=S.lab;if(X.trOff||!L.arts.length)return;const a=[...L.arts].sort((x,y)=>y.fol-x.fol)[0];if(aFame(a)<35||!ch(.12))return;
 X.trOff={aid:a.id,b:pick(['Sony Music','Universal Music','Warner Music','DMC','ONErpm']),fee:Math.round(askBase(a).adv*RF(2.5,4.5)/1e5)*1e5};log(`📩 ${X.trOff.b}, ${a.name} için ${fmtS(X.trOff.fee)} bonservis teklif etti! (Şirket › Transfer)`,'gold')}

function shTr(){const X=l2();if(!X.tr.length)trMarket();let h=note('Rakip sanatçılara bonservis teklif et. Başarı şansı şirketinin popülerliğine bağlı. Büyük şirketler de senin yıldızlarına teklif getirir.');

 h+=sec(`Transfer listesi · ${S.lab.arts.length}/${labCap()} sanatçı`);X.tr.forEach(o=>{const r=S.rivals.find(x=>x.id===o.rid);if(r)h+=row(`ACT.trBuy(${r.id})`,`<span class="av sa">${AV(r.look,28)}</span>`,esc(r.name),`${GENRES[r.genre].n} · şöhret ${Math.round(r.fame)}`,S.star?'⭐ Bedava':fmtS(o.fee))});

ACT.ceoFire=()=>{const X=l2();log(`${X.ceo.n} ile yollar ayrıldı. Tazminat ${fmtS(X.ceo.sal*2)}.`,'dim');S.lab.cash-=X.ceo.sal*2;X.ceo=null;drawSheet()};
function ceoTick(){const X=l2(),c=X.ceo,L=S.lab;if(!c)return;if(!S.star)L.cash-=c.sal;let rel=0,cl=0,sg=0;const sk=c.lv/100;
 L.arts.forEach(a=>a.demos.slice().forEach(d=>{const ok=c.st==='agresif'?d.q>=35:c.st==='temkinli'?d.q>=60-sk*10:d.q>=70-sk*8;if(!ok)return;const pi=c.st==='hit'?2:c.st==='agresif'?1:(d.q>=75?1:0),cost=[0,5e5,5e6][pi];if(L.cash<cost+(c.st==='temkinli'?2e7:0))return;
  const d0=drawSheet;drawSheet=()=>{};const l0=log;log=()=>{};try{ACT.relArt(a.id,d.id,pi)}finally{drawSheet=d0;log=l0}const s=L.songs[L.songs.length-1];if(s)s.pot*=1+sk*.25;rel++}));
 if(c.st!=='temkinli')L.songs.filter(s=>s.clip<=1&&(s.viral||s.lq>3e6)).forEach(s=>{const cc=Math.round(1500000*(hasLF('klip')?.5:1));if(L.cash>cc){L.cash-=cc;s.clip=2;s.pot*=1.3;cl++}});
 if(c.st==='agresif'&&L.arts.length<labCap()&&L.cash>3e7&&ch(.5)){const a=newCand();a.tal=clamp(a.tal+sk*20);const o=askBase(a);if(L.cash>o.adv){L.cash-=o.adv;a.con={adv:o.adv,roy:o.roy,yrs:3,reqS:6,rec:true,left:3,del:0,unrec:o.adv};L.arts.push(a);sg++}}
 L.arts.forEach(a=>{if(a.con.left<=1&&a.happy>40&&ch(sk))a.con.left+=2;a.happy=clamp(a.happy+sk*2)});
 if(rel||cl||sg)log(`👔 CEO ${c.n}: ${rel} şarkı yayınladı${cl?`, ${cl} klip çekti`:''}${sg?`, ${sg} yeni sanatçı imzaladı`:''}.`,'dim')}
function shCeo(){const X=l2();if(!X.ceoC.length)ceoCands();let h=note('CEO şirketi senin yerine yönetir: demoları yayınlar, klip çeker, sözleşmeleri uzatır. Sen başka işlerle uğraşırken şirket büyür.');
 if(X.ceo){const c=X.ceo;h+=`<div class="card"><div class="ch"><b>👔 ${esc(c.n)}</b><span class="pill">Yetenek ${c.lv}</span></div>${note(c.d+'<br>Maaş '+fmtS(c.sal)+'/3 ay + kârlı çeyreklerde %10 prim')}<button class="mini red" onclick="ACT.ceoFire()">Kov · tazminat ${fmtS(c.sal*2)}</button></div>`}
 else{h+=sec('Adaylar');X.ceoC.forEach((c,i)=>h+=row(`ACT.ceoHire(${i})`,'👔',`${c.n} · yetenek ${c.lv}`,c.d,S.star?'⭐ Bedava':fmtS(c.sal)+'/3 ay'));h+=row('ceoCands();drawSheet()','🔄','Yeni adaylar','','')}return h}

 const sy=P.cat.filter(s=>ch(.04+s.q/2000));sy.forEach(s=>{const t=pick([['dizi jeneriği',3e6],['reklam',5e6],['sinema filmi',8e6],['dijital dizi',4e6]]),v=Math.round(t[1]*(s.q/70)*RF(.6,1.4));L.cash+=v;P.tot+=v;s.sync++;log(`🎬 Yayıncılık: "${s.t}" bir ${t[0]}a lisanslandı, ${fmtS(v)} telif.`,'good')});

 const star=D.cl.find(c=>c.st>5e7&&!c.up);if(star){star.up=1;log(`📦 Dağıtımdaki ${star.n} patladı: 3 ayda ${num(star.st)} dinlenme! Şirketine imzalatabilirsin.`,'gold')}}
